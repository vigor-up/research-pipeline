name: Monitor & Trigger EVO-X2

on:
  schedule:
    # 每天 03:00 UTC+8 = 前日 19:00 UTC
    - cron: '0 19 * * *'
    # 每週六 09:00 UTC+8 = 01:00 UTC
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      action:
        description: '觸發動作'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - price_update
          - db_quality

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check target websites
        id: check
        run: |
          # 農業部價格監測
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://zdscxx.moa.gov.cn:8080/misportal/public/publicationViewRedirect.do" \
            --max-time 10 || echo "000")
          echo "moa_status=$HTTP_CODE" >> $GITHUB_OUTPUT

          # 搜豬網
          HTTP_CODE2=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://www.soozhu.com/market/" \
            --max-time 10 || echo "000")
          echo "pig_status=$HTTP_CODE2" >> $GITHUB_OUTPUT

          echo "trigger_time=$(date '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Notify Telegram - Status
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🔍 GitHub Actions 監控
時間: ${{ steps.check.outputs.trigger_time }}
農業部: ${{ steps.check.outputs.moa_status }}
搜豬網: ${{ steps.check.outputs.pig_status }}"

      # ── 僅 workflow_dispatch 手動觸發時才執行指令 ──────────
      - name: Manual action trigger (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ "$ACTION" = "price_update" ]; then
            MSG="/price_update"
          elif [ "$ACTION" = "db_quality" ]; then
            MSG="/db_quality"
          else
            MSG="/status"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=$MSG"

          echo "Manual trigger sent: $MSG"

      # ── Firecrawl 抓公開農業數據（FAO）─────────────────────
      - name: Run Firecrawl for public ag data
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -n "$FIRECRAWL_API_KEY" ]; then
            curl -s -X POST "https://api.firecrawl.dev/v1/scrape" \
              -H "Authorization: Bearer $FIRECRAWL_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"url":"https://www.fao.org/faostat/en/#data/QL","formats":["markdown"]}' \
              -o /tmp/fao_data.json || true
            echo "Firecrawl done"
          else
            echo "No Firecrawl key, skipping"
          fi

      - name: Upload results to R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: adb1040c847f4ae4a7d6bfedcccd7b77
        run: |
          if [ -f /tmp/fao_data.json ]; then
            echo "Would upload fao_data.json to R2"
          fi
          echo "Pipeline complete: $(date)"
