name: Research Paper Collection

on:
  schedule:
    - cron: '0 19 * * 6'   # Every Saturday 19:00 UTC = Sunday 03:00 UTC+8
  workflow_dispatch:         # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements_collect.txt

      - name: Collect papers (PubMed + EuropePMC + Lens)
        run: python collect/github_collector.py --output raw_papers.json
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}

      - name: Score credibility
        run: python collect/credibility_scorer.py --input raw_papers.json --output raw_papers.json

      - name: Upload to Cloudflare R2
        run: python collect/push_to_r2.py --input raw_papers.json
        env:
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}

      - name: Upload raw_papers as artifact (debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-papers-${{ github.run_number }}
          path: raw_papers.json
          retention-days: 7
