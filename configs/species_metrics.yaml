species:
  broiler:
    label: "Broiler / Native Chicken"
    metrics: [FCR, breast_yield_pct, carcass_rate_pct, mortality_rate, ADG, live_weight]
    roi_primary: [FCR, mortality_rate]
    units: {FCR: "ratio", breast_yield_pct: "%", carcass_rate_pct: "%",
            mortality_rate: "%", ADG: "g/day", live_weight: "g"}

  layer_hen:
    label: "Layer Hen"
    metrics: [egg_feed_ratio, laying_rate, peak_duration_weeks, mortality_rate,
              eggshell_strength, egg_weight_g, hen_day_production]
    roi_primary: [egg_feed_ratio, laying_rate]
    roi_note: "料蛋比+產蛋率是蛋雞ROI兩個核心驅動指標"
    units: {egg_feed_ratio: "ratio", laying_rate: "%", peak_duration_weeks: "weeks",
            mortality_rate: "%", eggshell_strength: "N", egg_weight_g: "g",
            hen_day_production: "%"}

  breeder_chicken:
    label: "Broiler Breeder"
    metrics: [fertility_rate, hatchability, healthy_chick_rate, chicks_per_hen_housed]
    roi_primary: [hatchability, chicks_per_hen_housed]
    units: {fertility_rate: "%", hatchability: "%", healthy_chick_rate: "%",
            chicks_per_hen_housed: "head/hen"}

  duck:
    label: "Meat Duck (Pekin)"
    metrics: [FCR, ADG, live_weight, mortality_rate]
    roi_primary: [FCR, mortality_rate]
    units: {FCR: "ratio", ADG: "g/day", live_weight: "g", mortality_rate: "%"}

  goose:
    label: "Goose"
    metrics: [FCR, live_weight, mortality_rate]
    roi_primary: [FCR]
    units: {FCR: "ratio", live_weight: "g", mortality_rate: "%"}

  suckling_piglet:
    label: "Suckling Piglet (Birth to Weaning)"
    metrics: [pre_weaning_mortality, weaning_weight, birth_weight, ADG, litter_weaning_rate]
    roi_primary: [pre_weaning_mortality, weaning_weight]
    roi_note: "哺乳期死亡率和斷奶體重直接影響後期效率"
    units: {pre_weaning_mortality: "%", weaning_weight: "kg", birth_weight: "kg",
            ADG: "g/day", litter_weaning_rate: "%"}

  nursery_pig:
    label: "Nursery Pig (7-25kg)"
    metrics: [FCR, ADG, diarrhea_rate, mortality_rate, weaning_to_finish_days]
    roi_primary: [FCR, diarrhea_rate, mortality_rate]
    units: {FCR: "ratio", ADG: "g/day", diarrhea_rate: "%",
            mortality_rate: "%", weaning_to_finish_days: "days"}

  finisher_pig:
    label: "Finisher Pig (>80kg)"
    metrics: [FCR, ADG, live_weight, carcass_rate, mortality_rate, backfat_mm]
    roi_primary: [FCR, ADG]
    units: {FCR: "ratio", ADG: "g/day", live_weight: "kg",
            carcass_rate: "%", mortality_rate: "%", backfat_mm: "mm"}

  pregnant_sow:
    label: "Pregnant Sow"
    metrics: [litter_size, healthy_piglet_count, healthy_piglet_weight,
              weak_piglet_rate, stillborn_rate, birth_weight_uniformity,
              farrowing_rate, wean_to_estrus_days, npe_per_sow_year]
    roi_primary: [healthy_piglet_count, healthy_piglet_weight, weak_piglet_rate]
    roi_note: "健仔數×健仔體重×弱仔率是母豬ROI三角"
    units: {litter_size: "head/litter", healthy_piglet_count: "head/litter",
            healthy_piglet_weight: "kg", weak_piglet_rate: "%",
            stillborn_rate: "%", birth_weight_uniformity: "%",
            farrowing_rate: "%", wean_to_estrus_days: "days",
            npe_per_sow_year: "head/sow/year"}

  lactating_sow:
    label: "Lactating Sow"
    metrics: [grade_a_weaner_rate, weaning_weight_uniformity, sow_weight_loss,
              milk_yield_kg_day, litter_gain_g_day]
    roi_primary: [grade_a_weaner_rate, sow_weight_loss]
    units: {grade_a_weaner_rate: "%", weaning_weight_uniformity: "%",
            sow_weight_loss: "kg", milk_yield_kg_day: "kg/day",
            litter_gain_g_day: "g/day"}

  boar:
    label: "Boar"
    metrics: [sperm_motility, semen_volume, abnormality_rate, sperm_concentration]
    roi_primary: [sperm_motility, abnormality_rate]
    units: {sperm_motility: "%", semen_volume: "mL",
            abnormality_rate: "%", sperm_concentration: "million/mL"}

  beef_cattle:
    label: "Beef Cattle"
    metrics: [FCR, ADG, slaughter_weight, carcass_dressing_pct, rearing_cycle_days, marbling_score]
    roi_primary: [FCR, ADG]
    units: {FCR: "ratio", ADG: "kg/day", slaughter_weight: "kg",
            carcass_dressing_pct: "%", rearing_cycle_days: "days", marbling_score: "score"}

  dairy_cow:
    label: "Dairy Cow"
    metrics: [milk_yield_kg_per_day, 305d_milk_yield, fat_pct, protein_pct, SCC]
    roi_primary: [milk_yield_kg_per_day, SCC]
    units: {milk_yield_kg_per_day: "kg/day", 305d_milk_yield: "kg",
            fat_pct: "%", protein_pct: "%", SCC: "cells/mL"}

  meat_sheep:
    label: "Meat Sheep"
    metrics: [FCR, ADG, slaughter_weight, carcass_dressing_pct, lambing_rate]
    roi_primary: [FCR, ADG]
    units: {FCR: "ratio", ADG: "g/day", slaughter_weight: "kg",
            carcass_dressing_pct: "%", lambing_rate: "%"}

  wool_sheep:
    label: "Wool Sheep (Merino)"
    metrics: [wool_yield_kg, wool_fibre_diameter, staple_length_mm,
              staple_strength_nkt, clean_fleece_pct, lambing_rate]
    roi_primary: [wool_yield_kg, staple_strength_nkt]
    roi_note: "產毛量×毛辮強度決定拍賣價格"
    units: {wool_yield_kg: "kg/head/year", wool_fibre_diameter: "micron",
            staple_length_mm: "mm", staple_strength_nkt: "N/ktex",
            clean_fleece_pct: "%", lambing_rate: "%"}

  meat_goat:
    label: "Meat Goat"
    metrics: [FCR, ADG, slaughter_weight]
    roi_primary: [FCR, ADG]
    units: {FCR: "ratio", ADG: "g/day", slaughter_weight: "kg"}

  dairy_goat:
    label: "Dairy Goat"
    metrics: [milk_yield_kg_per_day, 305d_milk_yield]
    roi_primary: [milk_yield_kg_per_day]
    units: {milk_yield_kg_per_day: "kg/day", 305d_milk_yield: "kg"}

  shrimp:
    label: "White Shrimp (Vannamei)"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG, vibrio_reduction_pct]
    roi_primary: [survival_rate, FCR]
    roi_note: "白蝦ROI：存活率×FCR，弧菌/EMS防控關鍵"
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days",
            ADG: "g/day", vibrio_reduction_pct: "%"}

  tiger_prawn:
    label: "Tiger Prawn (Penaeus monodon)"
    metrics: [FCR, survival_rate, harvest_cycle_days, market_weight]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", market_weight: "g"}

  giant_freshwater_prawn:
    label: "Giant Freshwater Prawn (Macrobrachium)"
    metrics: [FCR, survival_rate, harvest_cycle_days, market_weight]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", market_weight: "g"}

  tilapia:
    label: "Tilapia (Nile)"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG, streptococcus_survival_rate]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days",
            ADG: "g/day", streptococcus_survival_rate: "%"}

  milkfish:
    label: "Milkfish (Chanos chanos)"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", ADG: "g/day"}

  grey_mullet:
    label: "Grey Mullet / Mullet"
    metrics: [FCR, survival_rate, harvest_cycle_days, roe_yield_pct]
    roi_primary: [roe_yield_pct, survival_rate]
    roi_note: "台灣烏魚：卵巢率（烏魚子）是最高附加值指標"
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", roe_yield_pct: "%"}

  pangasius_catfish:
    label: "Pangasius Catfish (Basa)"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", ADG: "g/day"}

  channel_catfish:
    label: "Channel Catfish"
    metrics: [FCR, survival_rate, harvest_cycle_days]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days"}

  largemouth_catfish:
    label: "Largemouth Catfish"
    metrics: [FCR, survival_rate]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%"}

  largemouth_bass:
    label: "Largemouth Bass"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", ADG: "g/day"}

  grass_carp:
    label: "Grass Carp"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", ADG: "g/day"}

  grouper:
    label: "Grouper (Epinephelus)"
    metrics: [FCR, survival_rate, harvest_cycle_days]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days"}

  atlantic_salmon:
    label: "Atlantic Salmon"
    metrics: [FCR, survival_rate, harvest_cycle_days, ADG]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days", ADG: "g/day"}

  seabass:
    label: "European Seabass"
    metrics: [FCR, survival_rate, harvest_cycle_days]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days"}

  rice_field_eel:
    label: "Rice Field Eel"
    metrics: [FCR, survival_rate, harvest_cycle_days]
    roi_primary: [survival_rate, FCR]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days"}

  pond_loach:
    label: "Pond Loach (Misgurnus)"
    metrics: [FCR, survival_rate, harvest_cycle_days]
    roi_primary: [FCR, survival_rate]
    units: {FCR: "ratio", survival_rate: "%", harvest_cycle_days: "days"}

  mink:
    label: "Mink"
    metrics: [kit_survival_rate, kits_per_female, FCR, pelt_quality_grade_A_pct, grow_out_days]
    roi_primary: [pelt_quality_grade_A_pct, kits_per_female]
    units: {kit_survival_rate: "%", kits_per_female: "head/female",
            FCR: "ratio", pelt_quality_grade_A_pct: "%", grow_out_days: "days"}

  fox:
    label: "Fox (Silver / Blue)"
    metrics: [kits_per_female, pelt_quality_grade_A_pct, FCR]
    roi_primary: [pelt_quality_grade_A_pct, kits_per_female]
    units: {kits_per_female: "head/female", pelt_quality_grade_A_pct: "%", FCR: "ratio"}

  rabbit:
    label: "Rabbit"
    metrics: [FCR, ADG, slaughter_weight, kits_per_doe_year, mortality_rate]
    roi_primary: [FCR, kits_per_doe_year]
    units: {FCR: "ratio", ADG: "g/day", slaughter_weight: "kg",
            kits_per_doe_year: "head/doe/year", mortality_rate: "%"}

  deer:
    label: "Deer (Red Deer / Fallow)"
    metrics: [velvet_yield_kg, FCR, ADG]
    roi_primary: [velvet_yield_kg]
    roi_note: "鹿茸是主要ROI來源"
    units: {velvet_yield_kg: "kg/head/year", FCR: "ratio", ADG: "g/day"}

  crocodile:
    label: "Crocodile"
    metrics: [FCR, survival_rate, harvest_cycle_days, skin_quality_grade_A_pct]
    roi_primary: [skin_quality_grade_A_pct, survival_rate]
    units: {FCR: "ratio", survival_rate: "%",
            harvest_cycle_days: "days", skin_quality_grade_A_pct: "%"}

  wild_boar_hybrid:
    label: "Wild Boar Hybrid"
    metrics: [FCR, ADG, slaughter_weight]
    roi_primary: [FCR, ADG]
    units: {FCR: "ratio", ADG: "g/day", slaughter_weight: "kg"}


market_data:
  regions:
    china:
      - {id: CN_north,    label: "中國北方",  provinces: [河北, 山東, 遼寧, 吉林, 黑龍江]}
      - {id: CN_south,    label: "中國南方",  provinces: [廣東, 廣西, 福建, 海南, 雲南, 四川]}
      - {id: CN_central,  label: "中國中部",  provinces: [湖南, 湖北, 江蘇, 浙江, 安徽, 上海]}
      - {id: CN_northwest,label: "中國西北",  provinces: [新疆, 甘肅, 陝西, 寧夏]}
    taiwan:
      - {id: TW_all, label: "台灣全島"}
    sea:
      - {id: SEA_vietnam,     label: "越南"}
      - {id: SEA_thailand,    label: "泰國"}
      - {id: SEA_indonesia,   label: "印尼"}
      - {id: SEA_malaysia,    label: "馬來西亞"}
      - {id: SEA_philippines, label: "菲律賓"}

  source_priority:
    - {type: gov_stats,          credibility: 5, label: "政府統計"}
    - {type: vendor_whitepaper,  credibility: 5, label: "品種公司手冊"}
    - {type: academic_background,credibility: 4, label: "學術論文"}
    - {type: industry_media,     credibility: 3, label: "行業媒體"}
    - {type: vendor_claim,       credibility: 2, label: "廠商宣稱"}

  roi_params:
    product_dose_per_ton: 20
    roi_range_min: 3
    roi_range_max: 8
    currency_display: [CNY, USD, THB, VND]


