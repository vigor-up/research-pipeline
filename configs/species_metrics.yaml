settings:
  min_year: 1990
  max_results_per_query: 50
  request_delay_sec: 0.5
  batch_size: 5
  batch_delay_sec: 2
  qwen_endpoint: "http://127.0.0.1:1234/v1/chat/completions"
  chromadb_path: "D:/LLM/knowledge/biotech/db"
  chromadb_collection: "biotech_papers"
  store_threshold: 2
  query_default_min: 3
  highlight_threshold: 4
  market_data_db: "D:/LLM/knowledge/market/market_data.db"
  market_data_min_credibility: 3
