species:
  boar:
    label: "Boar"
    metrics: [sperm_motility, semen_volume, abnormality_rate]
    units:
      sperm_motility: "%"
      semen_volume: "mL"
      abnormality_rate: "%"

  pregnant_sow:
    label: "Pregnant Sow"
    metrics: [healthy_piglet_rate, birth_weight_uniformity, weak_piglet_rate]
    units:
      healthy_piglet_rate: "%"
      birth_weight_uniformity: "%"
      weak_piglet_rate: "%"

  lactating_sow:
    label: "Lactating Sow"
    metrics: [grade_a_weaner_rate, weaning_weight_uniformity, sow_weight_loss]
    units:
      grade_a_weaner_rate: "%"
      weaning_weight_uniformity: "%"
      sow_weight_loss: "kg"

  nursery_pig:
    label: "Nursery Pig"
    metrics: [ADG, FCR, diarrhea_rate]
    units:
      ADG: "g/day"
      FCR: "ratio"
      diarrhea_rate: "%"

  finisher_pig:
    label: "Finisher Pig (>80kg)"
    metrics: [FCR, carcass_rate, live_weight, slaughter_cost_per_kg,
              slaughter_price_per_kg, litter_size, healthy_piglet_count,
              healthy_piglet_weight, healthy_piglet_price]
    units:
      FCR: "ratio"
      carcass_rate: "%"
      live_weight: "kg"
      slaughter_cost_per_kg: "CNY/kg"
      slaughter_price_per_kg: "CNY/kg"
      litter_size: "head"
      healthy_piglet_count: "head"
      healthy_piglet_weight: "kg"
      healthy_piglet_price: "CNY/head"

  layer_hen:
    label: "Layer Hen"
    metrics: [laying_rate, FCR_egg, mortality_rate, peak_duration_weeks,
              egg_price_per_500g, eggshell_strength]
    units:
      laying_rate: "%"
      FCR_egg: "ratio"
      mortality_rate: "%"
      peak_duration_weeks: "weeks"
      egg_price_per_500g: "CNY/500g"
      eggshell_strength: "N"

  broiler:
    label: "Broiler / Native Chicken"
    metrics: [breast_yield_pct, carcass_rate_pct, FCR,
              live_price_per_500g, mortality_rate]
    units:
      breast_yield_pct: "%"
      carcass_rate_pct: "%"
      FCR: "ratio"
      live_price_per_500g: "CNY/500g"
      mortality_rate: "%"

  breeder_chicken:
    label: "Breeder Chicken"
    metrics: [fertility_rate, hatchability, healthy_chick_rate]
    units:
      fertility_rate: "%"
      hatchability: "%"
      healthy_chick_rate: "%"

  shrimp:
    label: "White Shrimp / Tiger Prawn"
    metrics: [survival_rate, FCR, harvest_cycle_days,
              vibrio_reduction_pct, EMS_resistance]
    units:
      survival_rate: "%"
      FCR: "ratio"
      harvest_cycle_days: "days"
      vibrio_reduction_pct: "%"
      EMS_resistance: "binary"

  tilapia:
    label: "Tilapia / Other Fish"
    metrics: [survival_rate, FCR, harvest_cycle_days,
              avg_body_weight_gain_pct, streptococcus_survival_rate]
    units:
      survival_rate: "%"
      FCR: "ratio"
      harvest_cycle_days: "days"
      avg_body_weight_gain_pct: "%"
      streptococcus_survival_rate: "%"

  livestock:
    label: "Beef Cattle / Dairy / Sheep"
    metrics: [ADG_beef_pct, FCR_beef, slaughter_weight_kg,
              rearing_cycle_days, rearing_cost_per_head,
              milk_yield_kg_per_day, FCR_sheep]
    units:
      ADG_beef_pct: "%"
      FCR_beef: "ratio"
      slaughter_weight_kg: "kg"
      rearing_cycle_days: "days"
      rearing_cost_per_head: "CNY/head"
      milk_yield_kg_per_day: "kg/day"
      FCR_sheep: "ratio"

# ══════════════════════════════════════════════════════════════════════════════
# 目標2：市場情報蒐集架構（新增 2026-05-05）
# 用途：銷售ROI工具 / 內部定價成本分析 / 競品B組對標
# ══════════════════════════════════════════════════════════════════════════════

market_data:

  # ── 地區定義 ──────────────────────────────────────────────────────────────
  regions:
    china:
      - id: CN_north
        label: "中國北方（華北/東北）"
        provinces: ["河北","山東","遼寧","吉林","黑龍江","北京","天津","內蒙古"]
      - id: CN_south
        label: "中國南方（華南/西南）"
        provinces: ["廣東","廣西","福建","海南","雲南","貴州","四川","重慶"]
      - id: CN_central
        label: "中國中部（華中/華東）"
        provinces: ["湖南","湖北","江西","安徽","江蘇","浙江","上海","河南"]
      - id: CN_northwest
        label: "中國西北（新疆/甘肅）"
        provinces: ["新疆","甘肅","陝西","寧夏","青海"]
    taiwan:
      - id: TW_all
        label: "台灣全島"
    sea:
      - id: SEA_vietnam
        label: "越南"
      - id: SEA_thailand
        label: "泰國"
      - id: SEA_indonesia
        label: "印尼"
      - id: SEA_malaysia
        label: "馬來西亞"
      - id: SEA_philippines
        label: "菲律賓"

  # ── 各物種市場參數 ─────────────────────────────────────────────────────────
  species_market_params:

    layer_hen:
      label: "蛋雞市場參數"
      kpis:
        - id: laying_rate_benchmark
          label: "產蛋率基準值"
          unit: "%"
          source_types: [gov_stats, industry_media, vendor_whitepaper]
        - id: egg_feed_ratio
          label: "蛋料比（蛋價/飼料價）"
          unit: "ratio"
          source_types: [gov_stats, industry_media]
        - id: mortality_cull_rate
          label: "死淘率"
          unit: "%"
          source_types: [industry_media, academic_background]
        - id: peak_production_weeks
          label: "產蛋峰值週期"
          unit: "weeks"
          source_types: [industry_media, academic_background]
        - id: egg_price_per_500g
          label: "雞蛋每斤價格"
          unit: "CNY/500g"
          source_types: [gov_stats, industry_media]
          regions: [CN_north, CN_south, CN_central, TW_all, SEA_vietnam, SEA_thailand]

    broiler:
      label: "肉雞市場參數"
      kpis:
        - id: broiler_fcr_benchmark
          label: "肉雞FCR基準值"
          unit: "ratio"
          source_types: [gov_stats, industry_media, vendor_whitepaper]
        - id: broiler_live_price
          label: "毛雞每斤收購價"
          unit: "CNY/500g"
          source_types: [gov_stats, industry_media]
          regions: [CN_north, CN_south, CN_central, TW_all, SEA_vietnam, SEA_thailand]

    finisher_pig:
      label: "育肥豬市場參數（>80kg出欄）"
      kpis:
        - id: pig_fcr_benchmark
          label: "育肥豬FCR基準值"
          unit: "ratio"
          source_types: [gov_stats, industry_media]
        - id: pig_slaughter_weight
          label: "出欄體重"
          unit: "kg"
          source_types: [gov_stats, industry_media]
        - id: pig_rearing_cost
          label: "養殖成本"
          unit: "CNY/head"
          source_types: [industry_media, vendor_whitepaper]
        - id: pig_slaughter_price
          label: "出欄價格"
          unit: "CNY/kg"
          source_types: [gov_stats, industry_media]
          regions: [CN_north, CN_south, CN_central, TW_all]
        - id: sow_litter_size
          label: "母豬產仔數"
          unit: "head/litter"
          source_types: [gov_stats, industry_media, academic_background]
        - id: healthy_piglet_count
          label: "健仔數"
          unit: "head/litter"
          source_types: [industry_media, academic_background]
        - id: healthy_piglet_weight
          label: "健仔體重"
          unit: "kg"
          source_types: [industry_media, academic_background]
        - id: healthy_piglet_price
          label: "健仔價格"
          unit: "CNY/head"
          source_types: [industry_media]

    livestock:
      label: "肉牛/肉羊市場參數"
      kpis:
        - id: cattle_fcr_benchmark
          label: "肉牛FCR基準值"
          unit: "ratio"
          source_types: [industry_media, academic_background]
        - id: cattle_rearing_cycle
          label: "養殖週期"
          unit: "days"
          source_types: [industry_media, academic_background]
        - id: cattle_slaughter_weight
          label: "出欄體重"
          unit: "kg"
          source_types: [gov_stats, industry_media]
        - id: cattle_rearing_cost
          label: "養殖成本"
          unit: "CNY/head"
          source_types: [industry_media]
        - id: sheep_fcr_benchmark
          label: "肉羊FCR基準值"
          unit: "ratio"
          source_types: [industry_media, academic_background]

    aquaculture:
      label: "魚蝦養殖市場參數"
      kpis:
        - id: aqua_fcr_benchmark
          label: "魚蝦FCR基準值"
          unit: "ratio"
          source_types: [industry_media, academic_background]
        - id: aqua_survival_rate
          label: "育成率"
          unit: "%"
          source_types: [industry_media, gov_stats]
        - id: aqua_harvest_cycle
          label: "收成週期"
          unit: "days"
          source_types: [industry_media, academic_background]

  # ── ROI 計算參數 ───────────────────────────────────────────────────────────
  roi_params:
    note: >
      用於銷售工具的 ROI 計算基礎數據。
      比例範圍 1:3～1:8，禁止用百分比呈現。
      所有價格數據需標記來源、地區、採集時間。
    product_dose_per_ton: 20  # kg/噸全價飼料
    roi_range_min: 3
    roi_range_max: 8
    currency_display: [CNY, USD, THB, VND]  # 禁用 NTD

  # ── 搜尋來源優先序 ─────────────────────────────────────────────────────────
  source_priority:
    - type: gov_stats
      label: "政府統計報告"
      examples: ["農業農村部","行政院農業部","FAO","泰國農業部"]
      credibility: 5
    - type: industry_media
      label: "行業媒體"
      examples: ["中國畜牧業","豬業科學","禽業科學","Water AQUA","Undercurrent News"]
      credibility: 4
    - type: vendor_whitepaper
      label: "競品廠商白皮書/官網"
      examples: ["DSM","Evonik","Novozymes","Kemin","Alltech"]
      credibility: 3
    - type: academic_background
      label: "學術論文背景數據"
      examples: ["Poultry Science","Animal Feed Science","Aquaculture"]
      credibility: 4

