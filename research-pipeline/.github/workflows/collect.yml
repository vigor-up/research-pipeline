name: Research Pipeline — Collect & Push R2

on:
  schedule:
    # 每週六 19:00 UTC = 週日 03:00 台灣時間
    - cron: "0 19 * * 6"
  workflow_dispatch:
    inputs:
      topics:
        description: "指定主題 (留空=全部)"
        required: false
        default: ""
      force_full:
        description: "強制全量爬取 (true/false)"
        required: false
        default: "false"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install httpx boto3 pyyaml beautifulsoup4 \
                      feedparser lxml tenacity python-dateutil

      - name: Download ingredients.yaml from R2
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'EOF'
          import boto3, os
          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          s3.download_file(os.environ["R2_BUCKET"], "configs/ingredients.yaml",
                           "configs/ingredients.yaml")
          print("ingredients.yaml downloaded from R2")
          EOF

      - name: Run collector
        env:
          SEMANTIC_SCHOLAR_KEY: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          LENS_API_TOKEN:       ${{ secrets.LENS_API_TOKEN }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          FORCE_FULL:           ${{ github.event.inputs.force_full || 'false' }}
          TOPICS_FILTER:        ${{ github.event.inputs.topics || '' }}
        run: |
          python collect/github_collector.py

      - name: Score credibility
        run: |
          python collect/credibility_scorer.py \
            --input /tmp/raw_papers_collected.json \
            --output /tmp/raw_papers_scored.json

      - name: Push to R2
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          python collect/push_to_r2.py \
            --input /tmp/raw_papers_scored.json

      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          try:
              with open("/tmp/raw_papers_scored.json") as f:
                  data = json.load(f)
              papers = data.get("papers", [])
              by_src = {}
              for p in papers:
                  s = p.get("source_type","unknown")
                  by_src[s] = by_src.get(s, 0) + 1
              print(f"Total collected: {len(papers)}")
              for k,v in sorted(by_src.items()):
                  print(f"  {k}: {v}")
          except Exception as e:
              print(f"Summary error: {e}")
          EOF
